name: Build Blender Extension

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read extension version
        id: version
        run: |
          python3 - <<'PY'
          import os
          import tomllib

          with open("mcb_blender/blender_manifest.toml", "rb") as handle:
              version = tomllib.load(handle)["version"]
          ref = os.environ.get("GITHUB_REF", "")
          if ref.startswith("refs/tags/v") and ref[len("refs/tags/v"):] != version:
              raise SystemExit(f"Tag {ref} does not match the manifest version {version}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
          PY

      - name: Package extension
        run: |
          mkdir -p dist
          find mcb_blender -type d -name __pycache__ -prune -exec rm -rf {} +
          # Blender extension layout: blender_manifest.toml at the archive root.
          cd mcb_blender
          zip -r "../dist/mcb_blender-${{ steps.version.outputs.version }}.zip" . -x "*.pyc" "*.pyo"

      - name: Upload versioned artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcb_blender-${{ steps.version.outputs.version }}
          path: dist/mcb_blender-${{ steps.version.outputs.version }}.zip

      - name: Publish release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/mcb_blender-${{ steps.version.outputs.version }}.zip
