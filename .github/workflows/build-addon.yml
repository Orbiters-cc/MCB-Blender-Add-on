name: Build Blender Addon

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read addon version
        id: version
        run: |
          python - <<'PY'
          import pathlib
          import re
          import os

          text = pathlib.Path("mcb_blender/__init__.py").read_text(encoding="utf-8")
          match = re.search(r'"version"\s*:\s*\(([^)]*)\)', text)
          if not match:
              raise SystemExit("Could not find bl_info version in mcb_blender/__init__.py")
          version = ".".join(part.strip() for part in match.group(1).split(",") if part.strip())
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
          PY

      - name: Package addon
        run: |
          mkdir -p dist
          find mcb_blender -type d -name __pycache__ -prune -exec rm -rf {} +
          zip -r "dist/mcb_blender-${{ steps.version.outputs.version }}.zip" mcb_blender \
            -x "*/__pycache__/*" "*.pyc" "*.pyo"

      - name: Upload versioned artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcb_blender-${{ steps.version.outputs.version }}
          path: dist/mcb_blender-${{ steps.version.outputs.version }}.zip

      - name: Publish release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/mcb_blender-${{ steps.version.outputs.version }}.zip
